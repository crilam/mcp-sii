<script type="text/javascript">
function paginacion(max, pag_solicitada)
{
 var i=0, tot_pag=0, pagina=0;
 var lista="";

 if (max > 100)
 { 
  pagina  = Number(pag_solicitada);
  tot_pag = Math.ceil(max/100);

  if (pagina>0)
   lista   += '<a href=\"javascript:listar('+ (pagina-1) + ');\">Anterior<\/a> &nbsp;&nbsp;';
     
  while (i<tot_pag)
  {
   if (i == pag_solicitada) 
    lista += '<b>' + (i+1) + '<\/b>&nbsp;&nbsp; ';
   else
    lista += '<A href=\"javascript:listar('+ i +');\" >' + (i+1) + '<\/A>&nbsp;&nbsp; ';
   i++;
  }
     
  if (pagina<(tot_pag-1))
   lista   += '<a href=\"javascript:listar('+ (pagina+1) +');\">Siguiente<\/a>';
 }
 document.write(lista);
}

function listar(pag_solicitada)
{
 document.formulario.action = 'TMBCOC_InformeMensualBhe.cgi';
 document.formulario.pagina_solicitada.value=pag_solicitada;
 document.formulario.submit();
}
</script>
