# Sin CI, el chequeo de anonimización sólo corre si alguien se acuerda de
# ejecutarlo antes de publicar — y este repositorio es público, así que ese
# chequeo es lo único que separa un dato personal de quedar publicado. Corre en
# cada push y cada pull request.
#
# La mayoría de los tests no usan credenciales ni red: todo va contra
# fixtures y mocks. Lo único que necesitan del sistema es `openssl`
# (tests/validateCert.test.ts genera un certificado de prueba), que
# ubuntu-latest ya trae en 3.x. Los tests de infra REST/Neon (tests/db,
# tests/rest, tests/scripts, tests/restServer.test.ts) sí necesitan un
# Postgres real — no se mockea esa lógica porque vive en SQL — por eso el
# service de abajo y TEST_DATABASE_URL.
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcp_sii
          POSTGRES_PASSWORD: mcp_sii
          POSTGRES_DB: mcp_sii_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://mcp_sii:mcp_sii@localhost:55432/mcp_sii_test

    strategy:
      fail-fast: false
      matrix:
        # Las dos puntas del rango que declara `engines` en package.json: la LTS
        # (24) y la versión sobre la que se desarrolla hoy (26). Validar una
        # sola dejaba un hueco en las dos direcciones: algo que se rompe sólo en
        # 26 pasaría el CI en verde, y un uso que 26 tolera y 24 no aparecería
        # recién al publicar.
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v4

      # El chequeo de anonimización enumera con `git ls-files`, así que necesita
      # el repositorio completo, no un árbol exportado.

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      # Incluye tests/anonimizacion.test.ts, el chequeo que evita publicar RUT,
      # correos e IP reales en un repositorio público.
      - name: Tests (incluye el chequeo de anonimización)
        run: npx jest

      - name: Build
        run: npm run build
